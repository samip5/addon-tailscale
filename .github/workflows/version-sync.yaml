---
name: Version Sync

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - tailscale/Dockerfile

permissions:
  contents: write

jobs:
  sync:
    name: Tag and release on Tailscale version change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Tailscale version
        id: version
        run: |
          ver=$(grep -oP 'ARG TAILSCALE_VERSION="\K[^"]+' tailscale/Dockerfile | sed 's/^v//')
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.version }}" | grep -q .; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.is_new == 'true'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.check.outputs.is_new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
