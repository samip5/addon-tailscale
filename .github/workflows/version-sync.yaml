---
name: Version Sync

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - tailscale/Dockerfile

permissions:
  contents: write

jobs:
  sync:
    name: Sync addon version with Tailscale
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tailscale version
        id: version
        run: |
          ver=$(grep -oP 'ARG TAILSCALE_VERSION="\K[^"]+' tailscale/Dockerfile | sed 's/^v//')
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.version }}" | grep -q .; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update config.yaml version
        if: steps.check.outputs.is_new == 'true'
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}/" tailscale/config.yaml

      - name: Commit, tag, and push
        if: steps.check.outputs.is_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tailscale/config.yaml
          git commit -m "⬆️ Bump addon version to ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.version }}"
          git push origin main --tags

      - name: Create GitHub release
        if: steps.check.outputs.is_new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
