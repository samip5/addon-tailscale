---
name: Version Sync

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - tailscale/Dockerfile

permissions:
  contents: write

jobs:
  sync:
    name: Sync addon version with Tailscale
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tailscale version
        id: version
        run: |
          ver=$(grep -oP 'ARG TAILSCALE_VERSION="\K[^"]+' tailscale/Dockerfile | sed 's/^v//')
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Check if version changed
        id: check
        run: |
          current=$(grep '^version:' tailscale/config.yaml | awk '{print $2}')
          if [ "${current}" != "${{ steps.version.outputs.version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update config.yaml version
        if: steps.check.outputs.changed == 'true'
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}/" tailscale/config.yaml

      - name: Commit and tag
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tailscale/config.yaml
          git commit -m "⬆️ Bump addon version to ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.version }}"
          git push origin main --tags

      - name: Create GitHub release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
