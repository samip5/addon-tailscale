---
name: Version Sync

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - tailscale/Dockerfile
      - tailscale/build.yaml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  sync:
    name: Compute version and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute new version
        id: version
        run: |
          ts_ver=$(grep -oP 'ARG TAILSCALE_VERSION="\K[^"]+' tailscale/Dockerfile | sed 's/^v//')
          latest_tag=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | head -1)

          if [[ -z "${latest_tag}" ]]; then
            new_version="${ts_ver}"
          else
            tag_base="${latest_tag%%-*}"
            if [[ "${tag_base}" == "${ts_ver}" ]]; then
              if [[ "${latest_tag}" == *"-"* ]]; then
                rev="${latest_tag##*-}"
                new_version="${ts_ver}-$((rev + 1))"
              else
                new_version="${ts_ver}-1"
              fi
            else
              new_version="${ts_ver}"
            fi
          fi

          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.version }}" | grep -q .; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update config.yaml version
        if: steps.check.outputs.is_new == 'true'
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}/" tailscale/config.yaml

      - name: Commit, tag, and push
        if: steps.check.outputs.is_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tailscale/config.yaml
          git commit -m "⬆️ Bump addon version to ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.version }}"
          git push origin main --tags

      - name: Create GitHub release
        if: steps.check.outputs.is_new == 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true

      - name: Dispatch versioned deploy
        if: steps.check.outputs.is_new == 'true'
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yaml/dispatches" \
            -d "{\"ref\":\"${{ steps.version.outputs.version }}\",\"inputs\":{\"version\":\"${{ steps.version.outputs.version }}\"}}"
